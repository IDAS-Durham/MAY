venue_type: "church"
activity_map_key: "primary_activity"
subset_key: "priest"

settings:
  verbose: true
  use_spatial_index: false

venue_selection:
  locate_person_by: "geographical_unit.coordinates"
  venue_geo_level: "MGU"
  batch_geo_level: "SGU"
  consider_by: "geo_unit"

eligibility:
  global_filters:
    - attribute: "Occode"
      type: "categorical"
      values: [6]

allocation:
  track_capacity: true
  when_full: "exclude"
  fixed_capacity: 4
  strategy: "closest_balanced"
  enforce_no_empty_venues: true

fallback:
  strategy: "skip"
