# Romantic / Sexual Relationship Configuration
# Assigns a sexual orientation to every adult and stamps a relationship_status.
# It recognises the couples household allocation already built (via the
# cohabiting_couple person property).

name: "romantic_relationships"

# Who gets an orientation assigned (global_filters, same shape as distributors;
# a person must pass ALL of them). Here: adults 16+.
eligibility:
  global_filters:
    - attribute: "age"
      type: "numerical"
      min: 16
      max: 120

# Orientation source. Declared explicitly: when `data_sources` is present the
# distributor rakes P(orientation | sex, age, geo_unit) from the two files by
# IPF, and both files MUST exist (fail-loud). Worlds without area
# orientation data (e.g. MedievalYaml) OMIT `data_sources` entirely and instead
# add a `probabilities` + `age_adjustments` block under `sexual_orientations`
# (the YAML path).
data_sources:
  demographic_distribution:            # P(orientation | sex, age_group)
    # SYNTHETIC. The measured national prior is embargoed and is not in this
    # repo. This stand-in is generated by
    # dev-scripts/make_synthetic_orientation_prevalence.py from a hand-set model
    # anchored on published census headlines: the age gradient and the sex
    # difference are real and public, the values are invented. The geographic
    # marginal below is real census data and, being the other half of the IPF,
    # pulls each area back to its measured level, so this file mostly supplies
    # the shape across age and sex. Swap the real table back in when the embargo
    # lifts; do not publish estimates of orientation by age off this file.
    path: "${data_root}/population/sexual_orientation/orientation_prevalence_synthetic.csv"
  geo_distribution:                    # P(orientation | geo_unit)
    # One file per nation, stacked into a single geo_unit -> shares table. The
    # three censuses each asked their own sexual-orientation question, so they
    # are built separately and only harmonised at the end: all three carry the
    # same three categories, renormalised over people who answered, keyed at the
    # nation's MGU (MSOA, intermediate zone, super data zone). A geo_unit
    # appearing in two files is a hard error.
    path:
      - "${data_root}/population/sexual_orientation/EW_orientation_by_mgu.csv"
      - "${data_root}/population/sexual_orientation/SCT_orientation_by_mgu.csv"
      - "${data_root}/population/sexual_orientation/NI_orientation_by_mgu.csv"
    geo_level: "MGU"                   # the geography level this distribution is keyed at

sexual_orientations:
  types:
    - heterosexual
    - homosexual
    - bisexual

  # orientation -> own_sex -> allowed partner sexes. Gates a coupled person's
  # orientation against their partner's sex (used on both the data and YAML paths).
  compatibility:
    heterosexual:
      male: [female]
      female: [male]
    homosexual:
      male: [male]
      female: [female]
    bisexual:
      male: [male, female]
      female: [male, female]

storage:
  orientation_key: "sexual_orientation"
  status_key: "relationship_status"
