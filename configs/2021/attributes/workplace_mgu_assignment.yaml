# Workplace MGU Assignment Configuration
# Assigns the specific MGU (MSOA) within the workplace LGU, weighted by real
# JOB SUPPLY (company capacity), not by where workers live.
#
# Company venues attach at MGU, so MGU is the natural workplace resolution. The
# weight is the summed employee_count capacity per MGU from the BRES-calibrated
# companies.csv.
#
# Assignment Level: person
# - Samples MGU within the workplace LGU weighted by total company capacity
# - More jobs -> higher probability of working in that MGU
#
# Dependencies: workplace_location (LGU name must be assigned first)

step:
  assignment_level: "person"

attributes:
  - name: "workplace_mgu"
    description: "Assigns specific MGU within workplace LGU, weighted by job supply"

# Filters - Only assign to working-age people (18-65)
filters:
  age:
    attribute: "age"
    type: "numerical"
    description: "Working age population"
    numerical:
      min: 18
      max: 64

  # Only people who have a workplace get an MGU within it. People with a
  # primary_activity (e.g. students) have no workplace_location to sample within.
  activities:
    exclude: ["primary_activity"]

  # Only the employed have a workplace_location to sample an MGU within.
  economic_activity:
    attribute: "economic_activity"
    type: "categorical"
    description: "In employment only"
    exclude: ["unemployed", "inactive"]

  # Skip workers whose workplace is outside the loaded world. They
  # carry the out-of-boundary sentinel from workplace_assignment and have no
  # in-world LGU to sample an MGU within. Must match `outside_value` there.
  out_of_boundary:
    attribute: "workplace_location"
    type: "categorical"
    description: "Exclude out-of-area workers (no in-world workplace MGU)"
    exclude: ["OUTSIDE"]

# Required Attributes (Dependencies)
required_attributes:
  - name: "workplace_location"
    description: "Workplace LGU must be assigned first"
    required: true

# Data Sources
data_sources:
  mgu_capacity_distribution:
    type: "csv_lookup"
    format: "gu_sampler"
    description: "MGU company-capacity totals within each LGU for job-supply weighting"

    files:
      - path: "${data_root}/activities/work/EW_workplace_capacity_by_mgu.csv"

        # Lookup key: the parent GU to sample within is the person's already
        # assigned workplace LGU. The key_columns value names that person
        # attribute, so the sampler stays generic over any parent attribute.
        key_columns:
          LGU: {attribute: workplace_location}

        # Geographical unit column: which GU level to sample. The loader
        # aggregates all MGUs under each parent LGU into a probability
        # distribution weighted by the weight column.
        geographical_unit_column:
          name: "MGU"   # CSV column name
          level: "MGU"  # Geographical level

        weight_column: "Total"  # Total company capacity (sum of employee_count)

      # Scotland and Northern Ireland, built to the same schema from their own
      # companies files. Identical columns to the England+Wales file, so they
      # stack; each MGU appears in exactly one of the three.
      - path: "${data_root}/activities/work/SCT_workplace_capacity_by_mgu.csv"
        key_columns:
          LGU: {attribute: workplace_location}
        geographical_unit_column:
          name: "MGU"
          level: "MGU"
        weight_column: "Total"

      - path: "${data_root}/activities/work/NI_workplace_capacity_by_mgu.csv"
        key_columns:
          LGU: {attribute: workplace_location}
        geographical_unit_column:
          name: "MGU"
          level: "MGU"
        weight_column: "Total"

# Assignment Rules (Person-Level)
assignment_rules:
  person:
    description: "Sample MGU within workplace LGU weighted by company capacity"

    rules:
      - description: "Probabilistic MGU selection weighted by job supply"
        priority: 1

        assignment:
          strategy: "geographical_unit_sampler"  # Generic strategy for sampling any GU level
          data_source: "mgu_capacity_distribution"

# Settings
settings:
  logging:
    show_attribute_distribution: false  # Too many MGUs to print
