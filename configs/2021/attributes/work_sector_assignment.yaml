# Work Sector Attribute Assignment Configuration
# Assigns work sector (industry) from the job mix of the person's assigned
# workplace MGU: the per-sector company capacity in that MGU, split into male/
# female seats by the census industry sex-ratio ({EW,SCT,NI}_workplace_capacity_
# by_mgu_sex.csv, from the BRES-calibrated per-nation companies files).
#
# Because the sector is drawn from the SAME employer stock the company
# distributor later matches against, a company of the drawn sector is present in
# the MGU by construction, so the draw cannot send a worker to a location with no
# employer of their sector.
#
# INTERIM LIMITATION: sex-blind. Keying on MGU alone drops the sex dimension
# (companies.csv carries no sex), so within a sector the assigned sex ratio
# reflects the local workforce rather than the sector-specific ratio. The
# planned remedy is IPF raking of these MGU sector shares to the TS060 LAD x sex
# margins; the sex-realism metric in the specialized viewers quantifies the
# gap in the meantime.
#
# Assignment Level: person
# Dependencies: workplace_location (LGU, for the OUTSIDE filter), workplace_mgu

step:
  assignment_level: "person"

attributes:
  - name: "work_sector"
    description: "Assigns industry sector from the workplace MGU's job mix"

# Filters - Only assign to working-age people (18-65)
filters:
  age:
    attribute: "age"
    type: "numerical"
    description: "Working age population"
    numerical:
      min: 18
      max: 64

  # Only people with an in-boundary workplace get a sector. Students
  # (primary_activity) have no workplace; OUTSIDE workers have no in-world
  # workplace MGU, so both would miss the MGU lookup key.
  activities:
    exclude: ["primary_activity"]

  economic_activity:
    attribute: "economic_activity"
    type: "categorical"
    description: "In employment only"
    exclude: ["unemployed", "inactive"]

  out_of_boundary:
    attribute: "workplace_location"
    type: "categorical"
    description: "Exclude out-of-area workers (no in-world workplace MGU, no sector row)"
    exclude: ["OUTSIDE"]

# Required Attributes (Dependencies)
required_attributes:
  - name: "workplace_location"
    description: "Workplace LGU (used by the OUTSIDE filter)"
    required: true
  - name: "workplace_mgu"
    description: "Workplace MGU must be assigned first (sector lookup key)"
    required: true

# Data Sources
data_sources:
  # Workplace MGU x sex -> per-sector company capacity distribution. Each MGU's
  # sector capacity is split into male/female seats by the census female share of
  # each industry, so the draw is sex-aware while total sector demand (hence
  # location realism) is unchanged.
  workplace_industry_by_mgu:
    type: "csv_lookup"
    format: "multi_key"
    description: "Industry (sex-split company-capacity) distribution by workplace MGU"

    files:
      - path: "${data_root}/activities/work/EW_workplace_capacity_by_mgu_sex.csv"

        # Lookup on the assigned workplace MGU and the person's sex.
        key_columns: &sector_keys
          MGU:
            attribute: "workplace_mgu"
            type: "direct"  # From person.properties["workplace_mgu"]
          Sex:
            attribute: "sex"
            type: "direct"  # person.sex (male/female)

        # Value columns: per-sector capacity (exact CSV column names A-Q/Other).
        value_columns: &sector_values
          A: "A"
          B: "B"
          C: "C"
          D: "D"
          E: "E"
          F: "F"
          G: "G"
          H: "H"
          I: "I"
          J: "J"
          K: "K"
          L: "L"
          M: "M"
          N: "N"
          O: "O"
          P: "P"
          Q: "Q"
          Other: "Other"

      # Scotland and Northern Ireland, same schema and same sector vocabulary,
      # so both reuse the mapping above. Each workplace MGU appears in exactly
      # one of the three files.
      - path: "${data_root}/activities/work/SCT_workplace_capacity_by_mgu_sex.csv"
        key_columns: *sector_keys
        value_columns: *sector_values

      - path: "${data_root}/activities/work/NI_workplace_capacity_by_mgu_sex.csv"
        key_columns: *sector_keys
        value_columns: *sector_values

# Assignment Rules (Person-Level)
assignment_rules:
  person:
    description: "Assign work sector from the workplace MGU's company mix"

    rules:
      - description: "Probabilistic sector assignment weighted by MGU capacity"
        priority: 1

        assignment:
          strategy: "categorical_sampler"  # Sample ONE category from probabilities
          data_source: "workplace_industry_by_mgu"
