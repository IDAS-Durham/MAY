# Workplace Location Assignment Configuration
# Assigns geographical workplace location and work mode to workers based on
# commuting flow patterns.
#
# Assignment Level: person
# - Assigns both workplace_location (LGU code) and work_mode (From_Home/Hybrid/Normal)
# - Based on origin-destination commuting likelihood matrices (LGU to LGU)
#
# Dependencies: commutes (the output-area commute/no-commute split, drawn first)
#
# This step decides WHERE someone works. The commute/no-commute split is drawn
# first by commutes_assignment at output-area resolution, and the matrix here is
# filtered to the rows consistent with that draw. The work_mode it emits is the
# finer Normal/Hybrid/Other/From_Home reading of a decision already taken.

step:
  assignment_level: "person"

# This step produces TWO attributes from one joint (origin-destination) draw;
# the rule's `outputs:` map wires the strategy's fields to these names.
attributes:
  - name: "workplace_location"
    description: "Geographical location (LGU) where the person works"
  - name: "work_mode"
    description: "Work mode: From_Home, Hybrid, or Normal commute"

# Filters - Only assign to working-age people (18-65)
# NOTE: We assign workplace to all working-age adults (potential workforce)
#       The actual 'work' activity should be assigned separately based on employment rates
filters:
  age:
    attribute: "age"
    type: "numerical"
    description: "Working age population"
    numerical:
      min: 18
      max: 64

  # Exclude people who already have a primary activity (e.g. students)
  activities:
    exclude: ["primary_activity"]

  # Only people in employment get a workplace. Unemployed and economically
  # inactive working-age adults do not commute to a job.
  economic_activity:
    attribute: "economic_activity"
    type: "categorical"
    description: "In employment only"
    exclude: ["unemployed", "inactive"]

# Required Attributes (Dependencies)
required_attributes:
  - name: "commutes"
    description: "Output-area commute/no-commute split must be drawn first"
    required: true

# Data Sources
data_sources:
  commuting_flows:
    type: "csv_lookup"
    format: "origin_destination_matrix"
    description: "Commuting likelihood from residence to workplace (LGU to LGU)"

    # Out-of-boundary destination policy. REQUIRED, with no default.
    # A region run (e.g. Manchester-only) draws workplace LGUs outside the loaded
    # world; this says what to do with them. It applies only to sub-national region runs.
    #   error        -> fail loud if any drawn destination is out of boundary
    #   redistribute -> keep workers in-boundary: drop out-of-boundary destinations
    #                   and renormalise each origin onto its in-boundary ones
    #   outside      -> model them as working outside the area (outside_value sentinel)
    out_of_boundary: "outside"
    # Required under redistribute: what to do for an origin whose ENTIRE
    # distribution is out of boundary (nothing to redistribute onto).
    on_empty: "outside"
    # Required whenever the 'outside' outcome can occur. The explicit sentinel
    # value written to workplace_location for out-of-area workers.
    outside_value: "OUTSIDE"

    files:
      - path: "${data_root}/activities/work/EW-work-destination-likelihood-modelled-prepandemic.csv"

        # Resolve each person's residence to an LGU name for the origin column;
        # sample an LGU destination from that origin's commuting distribution.
        destination_level: "LGU"  # Destination values are LGU names

        key_columns:
          LGU_origin_name:
            attribute: "geographical_unit"
            type: "ancestor_lookup"  # Traverse the person's geography to LGU
            level: "LGU"
            property: "name"  # Use the LGU name as the origin lookup key

        # The matched origin row contains destination options and their weights.
        destination_column: "LGU_destination_name"  # Sampled workplace LGU
        likelihood_column: "Likelihood"            # Relative probability of each destination
        metadata_columns:
          work_mode: "Place of work indicator"      # Returned with the sampled destination
          count: "Count"                             # Retained row metadata

        # No exclude_destinations. The census tables list non-LAD destinations
        # alongside real ones, including whole-country catch-alls ("England", "Wales",
        # "Northern Ireland"), "Offshore Installation", "Outside UK", "Other",
        # and a handful of MSOA-level names in the NI table. Excluding them
        # would DROP their likelihood and renormalise the rest, quietly moving
        # those commuters into in-country LADs. Instead they are left in and the
        # out_of_boundary policy above catches them: none is a unit at
        # destination_level, so each resolves to the OUTSIDE sentinel and the
        # worker is modelled as working beyond the simulated area.

      # Scotland. All three nations share one schema, so the column mapping
      # repeats verbatim. Origins are disjoint across the files (331 EW + 32 SCT
      # + 11 NI = 374 LGUs, no name appears twice), which is what the loader
      # needs to merge them into one origin lookup.
      - path: "${data_root}/activities/work/SCT-work-destination-likelihood-modelled-prepandemic.csv"

        destination_level: "LGU"

        key_columns:
          LGU_origin_name:
            attribute: "geographical_unit"
            type: "ancestor_lookup"
            level: "LGU"
            property: "name"

        destination_column: "LGU_destination_name"
        likelihood_column: "Likelihood"
        metadata_columns:
          work_mode: "Place of work indicator"
          count: "Count"

      # Northern Ireland. NISRA publishes this table by area NAME only, which is
      # why every file here matches on names rather than codes. Destinations are
      # UK-wide (373 of them), so an NI resident can be drawn to a GB workplace.
      - path: "${data_root}/activities/work/NI-work-destination-likelihood-modelled-prepandemic.csv"

        destination_level: "LGU"

        key_columns:
          LGU_origin_name:
            attribute: "geographical_unit"
            type: "ancestor_lookup"
            level: "LGU"
            property: "name"

        destination_column: "LGU_destination_name"
        likelihood_column: "Likelihood"
        metadata_columns:
          work_mode: "Place of work indicator"
          count: "Count"

# NOTE: there is deliberately NO fallback here. A person whose origin LGU is
# missing from the matrix fails the build loudly.

# Assignment Rules (Person-Level)
assignment_rules:
  person:
    description: "Assign workplace location and work mode based on commuting flows"

    rules:
      - description: "Sample destination from commuting flow matrix"
        priority: 1

        assignment:
          # Samples from the O-D matrix with work mode
          strategy: "commuting_likelihood"
          data_source: "commuting_flows"

          # Restrict the draw to O-D rows consistent with the commute/no-commute
          # split already taken at output-area level. The matrix answers only
          # WHERE, and only for people the finer source says actually travel.
          #
          # "Other" (no fixed place of work) sits on the travels side: the census
          # travel question asks how you usually get to work, and someone with no
          # fixed workplace still answers with a mode rather than "works from
          # home", so they are counted among the ten travel modes.
          condition:
            attribute: "commutes"
            metadata_key: "work_mode"
            map:
              travels: ["Normal", "Hybrid", "Other"]
              from_home: ["From_Home"]

          # Assigns both workplace_location and work_mode
          outputs:
            workplace_location: "destination"
            work_mode: "work_mode"

# Settings
settings:
  logging:
    show_attribute_distribution: false  # Disable detailed distribution (too many SGUs)



# Notes
# The commuting flow data includes:
# - Origin SGU (person's residence)
# - Destination SGU (workplace location)
# - Work mode (From_Home, Hybrid, Normal)
# - Likelihood (probability of this origin-destination-mode combination)
#
# The assignment process:
# 1. Look up all destination options for person's origin SGU
# 2. Sample a (destination, work_mode) pair weighted by likelihood
# 3. Assign workplace_location = destination SGU
# 4. Assign work_mode = sampled work mode
#
# Special cases:
# - From_Home: workplace_location will be set to destination SGU from data
#              (which should be same as origin, but we use the data value)
# - Hybrid: workplace_location is physical workplace (commute some days)
# - Normal: workplace_location is daily workplace
