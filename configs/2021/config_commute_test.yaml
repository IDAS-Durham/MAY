# Commute test world with varied geography for debugging the RouteDistributor.
#
# Spans three transport regions to exercise every commute mode + multi-leg
# interchanges + route-miss fallbacks in a single world:
#
#   * Greater Manchester (Manchester, Salford)     -> Metrolink (mode_class=tube)
#   * Inner London (Camden, Westminster, Islington, Lambeth)
#                                                  -> Tube interchanges, multi-leg
#                                                     journeys, Overground, Elizabeth
#   * Tyne & Wear + Durham
#     (Newcastle upon Tyne, Gateshead, County Durham, Darlington)
#                                                  -> Tyne & Wear Metro (tube),
#                                                     ECML rail (Durham<->Newcastle),
#                                                     mixed urban/rural for fallbacks
#
# ~9.5K SGUs / ~2.5M people. Output filename is distinct from existing worlds
# (world_state.h5, london_xlgu.h5, world_msm_hubs.h5) so this run will not
# overwrite them.

data_root: data

geography:
  data_dir: "${data_root}/geography"
  levels: ["SGU", "MGU", "LGU", "XLGU"]
  # This world is England-only, so only the EW files are wired in.
  hierarchy_file: EW_hierarchy.csv
  coord_files:
    SGU: EW_coord_sgu.csv
    MGU: EW_coord_mgu.csv
  load_all: false

  filter:
    level: LGU
    codes:
      # Greater Manchester (Metrolink)
      - "Manchester"
      - "Salford"
      # Inner London (TfL tube + rail)
      - "Camden"
      - "Westminster"
      - "Islington"
      - "Lambeth"
      # Tyne & Wear + Durham (Metro + ECML)
      - "Newcastle upon Tyne"
      - "Gateshead"
      - "County Durham"
      - "Darlington"

# POPULATION

population:
  data_dir: "${data_root}/population"
  demographics_male_file: "EW_demographics_male.csv"
  demographics_female_file: "EW_demographics_female.csv"

# VENUES

venues:
  data_dir: "${data_root}/venues"
  config_file: "${config_root}/venues/venues_config.yaml"

# HOUSEHOLDS

households:
  data_dir: "${data_root}/households"

  # All three files, even though this world is England-only. The allocation
  # strategy names both bucket schemes for large families (E&W and Scotland use
  # ">=2"; Northern Ireland splits it into exactly-2 and ">=3"), and the step
  # validator builds its vocabulary from the household files that were actually
  # loaded. Loading EW alone therefore makes the NI patterns look like typos and
  # stops the run before residence allocation. union_zero_fill gives NI-only
  # patterns a zero quota in English areas, which is what the strategy already
  # documents as the intended behaviour.
  data_file:
    - EW_households.csv
    - SCT_households.csv
    - NI_households.csv
  column_policy: union_zero_fill

  config_file: "${config_root}/households/households_config.yaml"
  rules_file: "${config_root}/households/relationship_rules.yaml"
# TIMELINE, same order as config.yaml and config_commute_uk.yaml.
#
# The three configs differ only in which geography they load. The step order is
# one pipeline and every config runs all of it, because the order encodes what
# each step is allowed to assume: the employment gate before anyone is sent to a
# workplace, the commute/no-commute split before the O-D matrix is asked where,
# and the three route distributors after the mode draw with bus last (train and
# tube hand their misses to it).

timeline:
  enabled: true

  steps:
    # 0. Households + residence venues (runs the allocation strategy first).
    - type: residence_allocation
      config: "${config_root}/households/allocation_strategy.yaml"

    # 1. Initial attributes
    - type: attribute
      config: "${config_root}/attributes/attribute_assignment.yaml"
    - type: attribute
      config: "${config_root}/attributes/comorbidity_assignment.yaml"

    # 2. Education
    - type: distributor
      config: "${config_root}/distributors/school_distributor.yaml"
    - type: child_creator
      config: "${config_root}/venue_child_creators/school_classrooms.yaml"
    - type: distributor
      config: "${config_root}/distributors/university_distributor.yaml"
    - type: child_creator
      config: "${config_root}/venue_child_creators/university_uni_years.yaml"

    # 3. Employment attributes
    # Employment gate first: workplace_assignment filters on economic_activity,
    # so without this step every 18-64 adult would be sent to a workplace.
    - type: attribute
      config: "${config_root}/attributes/economic_activity_assignment.yaml"

    # Commute/no-commute split at output-area resolution, before the workplace
    # draw. This is what keeps an all-home-working OA from producing commuters.
    - type: attribute
      config: "${config_root}/attributes/commutes_assignment.yaml"

    - type: attribute
      config: "${config_root}/attributes/workplace_assignment.yaml"
    - type: attribute
      config: "${config_root}/attributes/workplace_mgu_assignment.yaml"
    - type: attribute
      config: "${config_root}/attributes/work_sector_assignment.yaml"

    # 4. Specific workplaces
    - type: distributor
      config: "${config_root}/distributors/specific_workplace_hospitals_distributor.yaml"
    - type: distributor
      config: "${config_root}/distributors/specific_workplace_care_homes_distributor.yaml"
    - type: distributor
      config: "${config_root}/distributors/specific_workplace_classrooms_distributor.yaml"

    # 5. General employment
    - type: distributor
      config: "${config_root}/distributors/company_distributor.yaml"
    - type: child_creator
      config: "${config_root}/venue_child_creators/company_offices.yaml"

    # 6. Work mode correction
    - type: attribute
      config: "${config_root}/attributes/work_mode_correction.yaml"

    # 7. Commute assignment
    - type: attribute
      config: "${config_root}/attributes/commute_mode_assignment.yaml"

    # Route legs (commute mode -> transport_line venues + per-leg timing).
    # Bus MUST stay last: train and tube rewrite their misses to `bus`, and only
    # a distributor running after them will pick those riders up.
    - type: distributor
      config: "${config_root}/distributors/route_commute_train.yaml"
    - type: distributor
      config: "${config_root}/distributors/route_commute_tube.yaml"
    - type: distributor
      config: "${config_root}/distributors/route_commute_bus.yaml"

    # 8. Other services
    - type: distributor
      config: "${config_root}/distributors/hospital_distributor.yaml"
    - type: distributor
      config: "${config_root}/distributors/multi_venue_distributor.yaml"
    - type: distributor
      config: "${config_root}/distributors/care_home_visits_distributor.yaml"

# RELATIONSHIPS

relationship_pipeline:
  enabled: true
  relationships:
    - config: "${config_root}/relationships/social_networks.yaml"

romantic_relationships:
  enabled: true
  config: "${config_root}/relationships/romantic_relationships.yaml"

# SERIALIZATION with a distinct filename so existing worlds are not overwritten

serialization:
  enabled: true
  config_file: "${config_root}/serialization_config.yaml"
  output_dir: "${output_root}/2021"
  filename: "commute_test_world_v3.h5"
