# MAY Configuration File for England 2021, County Durham + Darlington.
#
# Every input here is the England+Wales (EW) file only; the Scotland and
# Northern Ireland files sit next to them in data/ and are simply not listed.
# For the four-nation version of this pipeline see config_commute_uk.yaml,
# which stacks all three per-nation files under each key.
#
# The shared configs under attributes/, distributors/, venues/ and households/
# are used by both, so they still list per-nation sources. That costs a little
# read time and nothing else: rows outside the loaded geography are filtered
# out on load and never match anything.

# ROOTS (set these for your machine)
# config_root: /absolute/path/to/configs/2021  # optional; defaults to this file's directory
data_root: data                                  # set to absolute path for collaboration
# output_root: /absolute/path/to/output         # optional; defaults to {CWD}/output

geography:
  # Path to geography data files
  data_dir: "${data_root}/geography"

  # Input files, named explicitly. Each key takes a single path or a list of
  # paths; a list is stacked into one table (all files must share columns,
  # and no unit may appear in two files). Relative paths resolve against
  # data_dir. This is an England-only build, so only the England+Wales (EW)
  # file is loaded. The Scotland (SCT_*) and Northern Ireland (NI_*) files
  # exist alongside it and would just be dead weight here. There is no
  # England-only cut of EW_hierarchy.csv; the filter below does that job.
  hierarchy_file: EW_hierarchy.csv

  # Coordinates per level, same path-or-list rule. A level omitted here
  # simply has no coordinates.
  coord_files:
    SGU: EW_coord_sgu.csv
    MGU: EW_coord_mgu.csv

  # Define hierarchy levels (smallest to largest)
  # If not specified, defaults to ["SGU", "MGU", "LGU"]
  # Examples:
  #   - ["SGU", "MGU", "LGU"]           # 3 levels (default)
  #   - ["SGU", "MGU", "LGU", "XLGU"]   # 4 levels
  #   - ["Block", "Tract", "County"]    # Custom names
  # These are generic size labels (Small/Medium/Large/eXtra-Large Geographical
  # Unit); the engine attaches no country meaning to them.
  # In THIS England build they map to real census units as follows:
  #   SGU  -> Output Area (OA)
  #   MGU  -> Middle-layer Super Output Area (MSOA)
  #   LGU  -> Local Authority District (LAD)   e.g. "County Durham", "Darlington"
  #   XLGU -> region (e.g. "North East")
  levels: ["SGU", "MGU", "LGU", "XLGU"]

  # Load all geographical units (ignores all filters below if true)
  load_all: false

  # FILTER - Specify which geographical units to load

  filter:
    # Level to filter on: LGU, MGU, or SGU
    # Leave as null to load all units
    level: LGU

    # Codes to filter (for small lists, comma-separated)
    codes: ["County Durham", "Darlington"]

    # Or specify a file path with codes (for large lists)
    # File should have one code per line
    #file: may/filters/example_mgu.txt

# POPULATION

population:
  # Path to population data files
  data_dir: "${data_root}/population"

  # Demographics files (matrix format: rows=geo_units, columns=ages).
  # Path or list of paths; stacked files must share the same age columns and
  # cover every loaded geo unit between them. England-only here, so the one
  # England+Wales file covers every loaded SGU on its own.
  demographics_male_file: EW_demographics_male.csv
  demographics_female_file: EW_demographics_female.csv


# VENUES

venues:
  # Path to venue files
  data_dir: "${data_root}/venues"

  # Path to YAML configuration file (relative to project root or absolute path)
  config_file: "${config_root}/venues/venues_config.yaml"


# HOUSEHOLDS

households:
  # Path to household data files
  data_dir: "${data_root}/households"

  # Household composition data (CSV with patterns like ">=2 >=0 2 0").
  # Path or list of paths. One England+Wales file here, so there is nothing to
  # stack and no `column_policy` to set, since that key only matters when files with
  # different pattern vocabularies (e.g. Northern Ireland's) are unioned.
  data_file: EW_households.csv

  # Configuration file for age categories and demotion rules
  config_file: "${config_root}/households/households_config.yaml"

  # Relationship rules (couple/family pair matching, age constraints).
  # Required for rules to apply. If this key is omitted, relationship rules
  # are disabled, so there is no implicit lookup.
  rules_file: "${config_root}/households/relationship_rules.yaml"

  # NOTE: which allocation strategy runs, and WHERE in the simulation it runs,
  # is owned by the timeline's `residence_allocation` step (its `config:` points
  # at the allocation_strategy.yaml). It is not configured here, which keeps a
  # single source of truth for allocation ordering. This block only holds the
  # household data/rules wiring.

# ATTRIBUTES

# TIMELINE - Unified Simulation Events
# Defines the exact sequence of simulation events (attribute assignment, venue distribution, etc.)
# This allows critical ordering, such as assigning schools/universities before workplaces.

timeline:
  enabled: true
  
  steps:
    # 0. Households + residence venues (care homes, boarding schools, dorms).
    #    Runs the full allocation_strategy.yaml. Placed first; move it later only
    #    if a residence allocation needs an attribute assigned by a prior step.
    - type: residence_allocation
      config: "${config_root}/households/allocation_strategy.yaml"

    # 1. Initial Attributes (Ethnicity, Comorbidities)
    - type: attribute
      config: "${config_root}/attributes/attribute_assignment.yaml"
      
    - type: attribute
      config: "${config_root}/attributes/comorbidity_assignment.yaml"

    # 2. Education (Assigns primary_activity = school/university)
    # School distribution
    - type: distributor
      config: "${config_root}/distributors/school_distributor.yaml"
      
    - type: child_creator
      config: "${config_root}/venue_child_creators/school_classrooms.yaml"

    # University distribution
    - type: distributor
      config: "${config_root}/distributors/university_distributor.yaml"
      
    - type: child_creator
      config: "${config_root}/venue_child_creators/university_uni_years.yaml"

    # 3. Employment (Filters out people with primary_activity)
    # Employment gate: assign economic_activity; only the employed get a workplace
    - type: attribute
      config: "${config_root}/attributes/economic_activity_assignment.yaml"

    # Commute/no-commute split, drawn at output-area resolution. Runs before the
    # workplace draw so the O-D matrix only ever answers WHERE, for people the
    # finer source says actually travel to work.
    - type: attribute
      config: "${config_root}/attributes/commutes_assignment.yaml"

    # Workplace location assignment (LGU + Work Mode)
    - type: attribute
      config: "${config_root}/attributes/workplace_assignment.yaml"

    # Workplace MGU assignment (within LGU, weighted by job supply)
    - type: attribute
      config: "${config_root}/attributes/workplace_mgu_assignment.yaml"
      
    # Work sector assignment
    - type: attribute
      config: "${config_root}/attributes/work_sector_assignment.yaml"

    # 4. Specific Workplaces (Hospitals, Care Homes, Schools, etc.)
    # Q sector -> Hospitals
    - type: distributor
      config: "${config_root}/distributors/specific_workplace_hospitals_distributor.yaml"
      
    # Q sector -> Care Homes
    - type: distributor
      config: "${config_root}/distributors/specific_workplace_care_homes_distributor.yaml"
      
    # P sector -> Schools
    - type: distributor
      config: "${config_root}/distributors/specific_workplace_classrooms_distributor.yaml"
      
    # 5. General Employment (Companies)
    - type: distributor
      config: "${config_root}/distributors/company_distributor.yaml"

    - type: child_creator
      config: "${config_root}/venue_child_creators/company_offices.yaml"

    # 6. Work mode correction
    # Overrides `work_mode` for workers placed in on-site venues
    # (hospital/care_home/classroom), forcing them to Normal regardless of
    # what the area-level O-D matrix in workplace_assignment sampled.
    # Office workers are left untouched.
    - type: attribute
      config: "${config_root}/attributes/work_mode_correction.yaml"

    # 7. Commute assignment
    # Runs AFTER all workplace distributors so it can gate on the actually-assigned
    # workplace venue (office/classroom/hospital/care_home, worker subset).
    - type: attribute
      config: "${config_root}/attributes/commute_mode_assignment.yaml"

    # Route legs for shared-transport modes. Each instance is a generic
    # RouteDistributor filtered to one mode_class. It places riders on the
    # transport_line venues their journey traverses and records per-leg
    # (t_board_min, t_alight_min) on Subset.member_metadata.
    #
    # Bus MUST stay last. Train and tube rewrite a rider the network cannot
    # serve to `bus` rather than taking them off shared transport, and only a
    # distributor running after them will pick those riders up.
    - type: distributor
      config: "${config_root}/distributors/route_commute_train.yaml"

    - type: distributor
      config: "${config_root}/distributors/route_commute_tube.yaml"

    - type: distributor
      config: "${config_root}/distributors/route_commute_bus.yaml"

    # 8. Other Services
    - type: distributor
      config: "${config_root}/distributors/hospital_distributor.yaml"

    # Leisure (multi-venue)
    - type: distributor
      config: "${config_root}/distributors/multi_venue_distributor.yaml"

    # Care Home Visits (linked to residents)
    - type: distributor
      config: "${config_root}/distributors/care_home_visits_distributor.yaml"

# RELATIONSHIP PIPELINE - Build agent networks
# Build relationship networks between agents for disease modeling.
# All relationship types are fully configurable via YAML.

relationship_pipeline:
  enabled: true

  relationships:
    # Friendships network (for disease transmission)
    - config: "${config_root}/relationships/social_networks.yaml"

  # Notes:
  # - Each relationship config defines a different type of network
  # - Relationships are built AFTER venue assignments (so activity_map is populated)
  # - Connections are stored in person.properties (key defined in YAML config)
  # - Add property names to serialization_config.yaml to include in HDF5 export

# ROMANTIC RELATIONSHIPS - Sexual orientation
# Assigns a sexual orientation to every adult and stamps a relationship_status.

romantic_relationships:
  enabled: true
  config: "${config_root}/relationships/romantic_relationships.yaml"

  # Notes:
  # - Runs AFTER the timeline and social relationships (order fixed in create_world.py)
  # - Recognizes existing household couples via the cohabiting_couple property that
  #   household allocation writes when a relationship_rules.yaml pair rule is flagged
  #   creates_romantic_couple. It only READS that couple.
  # - Orientation source is declared explicitly (see romantic_relationships.yaml):
  #   data_sources present -> raked from CSVs (fail loud if missing); absent -> YAML probabilities.

serialization:
  enabled: true
  config_file: "${config_root}/serialization_config.yaml"
  output_dir: "${output_root}/2021"
  filename: "world_state.h5"

# EXAMPLES

# Example 1: Load only London LGU and all its children
# filter:
#   level: LGU
#   codes: [London]
#   file: null

# Example 2: Load specific MGUs from a file (for large lists)
# filter:
#   level: MGU
#   codes: []
#   file: filters/my_mgus.txt

# Example 3: Load specific MGUs inline (for small lists)
# filter:
#   level: MGU
#   codes: [E02000173, E02000187, E02000414]
#   file: null

# Example 4: Load specific SGUs and their parent hierarchy
# filter:
#   level: SGU
#   codes: [E00004320, E00004321, E00004326]
#   file: null

# Example 5: Load all units (set load_all to true OR set level to null)
# load_all: true
# OR
# filter:
#   level: null
#   codes: []
#   file: null
