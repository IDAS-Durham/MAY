# Unified Allocation Strategy Configuration
#
# This file defines the complete allocation order for both households and venues.
# Steps are executed sequentially in the order defined here.

enabled: true

# ALLOCATION STEPS
# Steps are executed in order. Each step can be either:
#   - type: "household" - Allocate people to households
#   - type: "venue" - Allocate people to venues
#
# The system automatically handles:
#   - Marking people as allocated
#   - Refreshing pools between steps
#   - Tracking statistics

steps:
  # Step 1a: Two-Adult Families with Children
  - name: "Two-Adult Families with Children"
    type: "household"
    description: "Allocate two-adult families with kids"
    rule: "Two-adult family with kids"

    # Selected by shape rather than by pattern string, because the string
    # differs between census vocabularies: England/Wales/Scotland bucket 2+ kids
    # as ">=2", Northern Ireland splits it into exactly-2 and ">=3". "Kids >= 1
    # with exactly 2 adults" names the family in either, so this file works
    # whether one nation or four is loaded, and picks up only the patterns the
    # loaded data actually has.
    patterns_where:
      - { category: "Kids",   operator: ">=", value: 1 }
      - { category: "Adults", operator: "==", value: 2 }

    max_households: null
    refresh_pools: false
    enable_demotion: null

    # When pattern demotes, switch to these rules
    demotion_rules:
      ">=2 >=0 1 0": "Single-adult family with kids"
      "2 >=0 1 0": "Single-adult family with kids"
      ">=3 >=0 1 0": "Single-adult family with kids"
      "1 >=0 1 0": "Single-adult family with kids"

  # Step 1b: Single-Parent Families with Children
  - name: "Single-Parent Families with Children"
    type: "household"
    description: "Allocate single-parent families with kids"
    rule: "Single-adult family with kids"

    # Same shape as the step above, one adult instead of two.
    patterns_where:
      - { category: "Kids",   operator: ">=", value: 1 }
      - { category: "Adults", operator: "==", value: 1 }

    max_households: null
    refresh_pools: false
    enable_demotion: null

  # Step 2: Mixed/Flexible Households
  - name: "Multi-generational Households"
    type: "household"
    description: "Multi-generational households"
    rule: "Multi-generational household"

    # Kid households where the census leaves the adult column open (">=0"):
    # somebody older is there, but the bucket does not say who or how many.
    patterns_where:
      - { category: "Kids",   operator: ">=", value: 1 }
      - { category: "Adults", operator: "==", value: 0 }

    # An open-ended bucket has to be built at some concrete size, so each
    # pattern declares the shape assumed for it: the minimum number of kids the
    # bucket guarantees, plus one adult and one old adult. Keys naming a pattern
    # the loaded census does not have are skipped, so the England/Wales/Scotland
    # (">=2") and Northern Ireland ("2" / ">=3") spellings can both sit here.
    assumptions:
      "1 >=0 >=0 >=0":   "1 0 1 1"
      ">=2 >=0 >=0 >=0": "2 0 1 1"
      "2 >=0 >=0 >=0":   "2 0 1 1"
      ">=3 >=0 >=0 >=0": "3 0 1 1"

    max_households: null
    refresh_pools: false
    enable_demotion: null

  # Step 3a: Two-Adult Families with Young Adults (no kids)
  - name: "Two-Adult Families with YA, no kids"
    type: "household"
    description: "Allocate two-adult families with Young Adults, no kids"
    rule: "Two-adult family with young adults"  # Use relationship rules

    patterns:
      - "0 >=1 2 0"

    max_households: null
    refresh_pools: false
    enable_demotion: null

    # When pattern demotes, switch to these rules
    demotion_rules:
      "0 >=1 1 0": "Single-adult family with young adults"

  # Step 3b: Single-Adult Families with Young Adults (no kids)
  - name: "Single-Adult Families with YA, no kids"
    type: "household"
    description: "Allocate single-adult families with Young Adults, no kids"
    rule: "Single-adult family with young adults"  # Use relationship rules

    patterns:
      - "0 >=1 1 0"

    max_households: null
    refresh_pools: false
    enable_demotion: null


  # Step 3c: Elderly to Care Homes (Venues)
  #
  # This runs BEFORE the elderly household steps, and that order decides which
  # people are still in the pool when each one draws.
  #
  # The census splits usual residents into household residents and communal
  # residents. The household composition counts describe the first block and the
  # care-home venue counts describe the second, so the two never claim the same
  # person. The engine has no such partition: every step draws from one pool of
  # people, so whichever runs first takes its share from the whole age
  # distribution and leaves the rest whatever remains.
  #
  # The two draws are not symmetric. This step is age-selective, needing the
  # oldest tail. The elderly household patterns are age-blind above 65: "0 0 0 2"
  # asks for two old adults, not which two. Running the age-blind steps first
  # strips a little over half the 65+ population uniformly, including half the
  # 85-year-olds, and no weighting can recover a tail that has already gone.
  # Running this step first takes the tail it needs and hands back a residual
  # the household steps are, by their own definition, indifferent to.
  - name: "Elderly to Care Homes"
    type: "venue"
    description: "Allocate elderly to care homes, weighted by care-home residence rate"

    venue_type: "care_home"

    subset_key: "resident"

    # General eligibility (pre-filter before attribute matching)
    # This gets people who are eligible, then they get sorted into the age
    # slots defined by capacity_config.
    eligibility:
      - attribute: "age"
        min: 50  # Minimum age to consider for care homes

    # Capacity rules for this step. The venue files carry two resident columns.
    # No UK nation publishes care-home-specific age detail finer than this that
    # survives across all three, so the slots stop here and the fill strategy
    # below carries the age structure instead.
    capacity_config:
      attribute_capacities:
        column_mappings:
          n_50_64:
            age_band: [50, 64]
          n_65_plus:
            age_band: [65, 120]

    # Weighted sample without replacement: someone's chance of being drawn early
    # is proportional to their band's care-home RESIDENCE RATE, meaning care-home
    # residents divided by population, by age band.
    #
    # It has to be a rate and not a share of residents. The pool being drawn
    # from already carries the local age structure, so weighting by "share of
    # care-home residents in this band" would let that structure count twice.
    # By rate, age 90 outweighs age 65 by 24.5x; by share of residents, only
    # 3.6x, under-placing the very old by roughly sevenfold.
    #
    # The rates are sex-neutral at every band (0.1131 female against 0.1084 male
    # at 85-94), so one curve serves both sexes and there is no sex term.
    #
    # 85+ stays a single open band. A finer curve above it would need a finer
    # denominator, and the England and Wales single-year population above 85 is
    # disaggregated from a census band that has no internal detail.
    #
    # The 50-64 row never competes with the others, because the strategy is
    # applied per capacity slot and that slot holds only 50-64s at one weight.
    # It is here so the curve reads as the curve, and so the config does not
    # silently depend on where the slot boundaries happen to fall.
    strategy: "age_weighted"
    strategy_config:
      bands:
        - {range: [50, 64],  weight: 0.00128}
        - {range: [65, 65],  weight: 0.0066}
        - {range: [66, 69],  weight: 0.0069}
        - {range: [70, 74],  weight: 0.0092}
        - {range: [75, 79],  weight: 0.0174}
        - {range: [80, 84],  weight: 0.0347}
        - {range: [85, 120], weight: 0.1133}


  # Step 4a: Elderly Couples
  - name: "Elderly Couples"
    type: "household"
    description: "Allocate elderly couples"
    rule: "Elderly pair"  # Use relationship rules

    patterns:
      - "0 0 0 2"       # 2 old adults

    max_households: null
    refresh_pools: false
    enable_demotion: null

  # Step 4b: Elderly Singles
  - name: "Elderly Singles"
    type: "household"
    description: "Allocate single elderly (simple allocation, no rules)"

    patterns:
      - "0 0 0 1"       # 1 old adult

    max_households: null
    refresh_pools: false
    enable_demotion: null

  # Step 5a: Adult Couples
  - name: "Adult Couples"
    type: "household"
    description: "Allocate adult couples"
    rule: "Adult pair"  # Use relationship rules

    patterns:
      - "0 0 2 0"       # 2 adults

    max_households: null
    refresh_pools: false
    enable_demotion: null

  # Step 5b: Adult Singles
  - name: "Adult Singles"
    type: "household"
    description: "Allocate single adults (simple allocation, no rules)"

    patterns:
      - "0 0 1 0"       # 1 adult

    max_households: null
    refresh_pools: false
    enable_demotion: null


  # Step 6: Young Adult Pairs (Households)
  - name: "Young Adult Pairs (with assumption)"
    type: "household"
    description: "Allocate young adults to paired households"

    patterns:
      - pattern: "0 >=0 0 0"     # Flexible young adults (any number)
        assumption: "0 2 0 0"    # Assume pairs of 2 young adults

    max_households: null
    refresh_pools: false
    enable_demotion: null

  # Step dfsdfsd: Kids to Boarding Schools (Venues)
  - name: "Kids to Boarding Schools"
    type: "venue"
    description: "Allocate kids to boarding schools with age-band matching"

    venue_type: "boarding_school"

    subset_key: "resident"

    # General eligibility (pre-filter before attribute matching)
    # People will be sorted into age-band slots based on capacity_config
    # The ceiling mirrors the school distributor's 0-19 filter. Without it the
    # only age limit is StatutoryHighAge from the CSV, and a handful of ISC
    # members are international colleges that report boarders into their
    # twenties (CATS Cambridge returns 28). Capping here keeps the CSV faithful
    # to what the schools actually reported while stopping the allocator from
    # putting adults in a boarding house.
    eligibility:
      - attribute: "age"
        max: 19

    # Capacity rules for this step.
    # Each allocation step owns its own capacity rules, since the same venue type
    # could be used by a different step with different capacity semantics.
    capacity_config:
      total_capacity_column: "n_total"
      # Boarder counts come from the schools' own returns, which report sex but
      # not an age distribution. The age bands this step used to carry were an
      # artefact of the census communal-establishment tables; they are gone
      # because nothing in the source supports them. Age is still constrained,
      # but by the school's actual boarding age range rather than by a band.
      attribute_capacities:
        column_mappings:
          n_male:
            sex: "male"
          n_female:
            sex: "female"
      # Per-venue hard limits from CSV columns (inclusive ranges).
      attribute_constraints:
        age:
          min_column: "StatutoryLowAge"
          max_column: "StatutoryHighAge"

    strategy: "random"

  # Step 9: Students to Dormitories (Venues)
  - name: "Students to Dormitories"
    type: "venue"
    description: "Allocate young adults to student dorms with age-band matching"

    venue_type: "student_dorms"

    # Subset to add residents to
    subset_key: "resident"

    # General eligibility (pre-filter before attribute matching)
    # People will be sorted into age-band slots based on capacity_config
    eligibility:
      - attribute: "age"
        min: 16

    # Capacity rules for this step.
    capacity_config:
      total_capacity_column: "n_total"
      # Two bands, because two is all the sources agree on. England & Wales
      # publishes 16-17/18-20/21-24/25-29/30+, Scotland 0-15/16-24/25-34/35-49/
      # 50-64/65+, and neither set nests inside the other. 16-24 and 25+ are the
      # finest split both can produce without inventing a distribution, and the
      # university distributor filters to 18-24 anyway, so the lost detail never
      # reached the model.
      attribute_capacities:
        column_mappings:
          n_16_24:
            age_band: [18, 24]
          n_25_plus:
            age_band: [25, 99]

    strategy: "random"

  # Step 10: Multi-Elderly  (Households)
  - name: "Multi-elderly"
    type: "household"
    description: "Allocate remaining elderly to multi-elderly household"

    patterns:
      - "0 0 0 >=3"     # 3+ old adults

    max_households: null
    refresh_pools: false
    enable_demotion: null

  # Step 11: Add Excess Kids to Families (Household Excess)
  - name: "Add Excess kids to Family households"
    type: "household_excess"
    description: "Add remaining kids to existing kids households"

    target_patterns:
      - ">=2 >=0 2 0"
      - "2 >=0 2 0"
      - ">=3 >=0 2 0"
      - ">=2 >=0 1 0"
      - "2 >=0 1 0"
      - ">=3 >=0 1 0"
      - ">=2 >=0 >=0 >=0"
      - "2 >=0 >=0 >=0"
      - ">=3 >=0 >=0 >=0"

    add_category: "Kids"

    constraints:
      - category_sum: ["Kids"]
        max: 4

    add_distribution:
      type: "poisson"
      mean: 2
      min: 0     
      max: 4     

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: false  # Refresh to get remaining young adults after dorm allocation

  # Step 11: Add Young Adults to Young Adult households (Household Excess)
  - name: "Add Young Adults to Young Adults households"
    type: "household_excess"
    description: "Add remaining young adults to existing young adult households"

    target_patterns:
      - "0 >=0 0 0"

    add_category: "Young Adults"

    constraints:
      - category_sum: ["Young Adults"]
        max: 6

    add_distribution:
      type: "poisson"
      mean: 4
      min: 0     
      max: 6   

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: false  # Refresh to get remaining young adults after dorm allocation

  # Step 12a: Add Young Adults to Two-Adult Families without Kids (Household Excess)
  - name: "Add Young Adults to Two-Adult Families without Kids"
    type: "household_excess"
    description: "Add remaining young adults to existing two-adult family households without kids"
    rule: "Add young adults to existing family"  # Enforce age constraints with existing adults

    target_patterns:
      - "0 >=1 2 0"

    add_category: "Young Adults"

    constraints:
      - category_sum: ["Young Adults"]
        max: 4

    add_distribution:
      type: "poisson"
      mean: 3
      min: 0
      max: 8

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: false

  # Step 12b: Add Young Adults to Single-Adult Families without Kids (Household Excess)
  - name: "Add Young Adults to Single-Adult Families without Kids"
    type: "household_excess"
    description: "Add remaining young adults to existing single-adult family households without kids"
    rule: "Add young adults to existing family"  # Enforce age constraints with existing adult

    target_patterns:
      - "0 >=1 1 0"

    add_category: "Young Adults"

    constraints:
      - category_sum: ["Young Adults"]
        max: 4

    add_distribution:
      type: "poisson"
      mean: 2
      min: 0
      max: 8

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: false 

  # Step 13: Add Young Adults to Families (Household Excess)
  - name: "Add Young Adults to Families"
    type: "household_excess"
    description: "Add remaining young adults to existing family households"
    rule: "Add young adults to existing family"  # Enforce age constraints with existing adults

    target_patterns:
      - ">=2 >=0 2 0"   # Families with 2+ kids, 2 adults
      - "1 >=0 2 0"     # Families with 1 kid, 2 adults

    add_category: "Young Adults"

    constraints:
      - category_sum: ["Kids", "Young Adults"]
        max: 8

    add_distribution:
      type: "poisson"
      mean: 1
      min: 0
      max: 4

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: false 

  # Step 14: Add Young Adults to multigenerational families (Household Excess)
  - name: "Add Young Adults to multi-generational Families"
    type: "household_excess"
    description: "Add remaining young adults to existing multi generational family households"
    rule: "Add young adults to existing family"  # Enforce age constraints with existing adults

    target_patterns:
      - "1 >=0 >=0 >=0"
      - ">=2 >=0 >=0 >=0"

    add_category: "Young Adults"

    constraints:
      - category_sum: ["Kids", "Young Adults"]
        max: 6

    add_distribution:
      type: "poisson"
      mean: 3
      min: 0
      max: 4

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: false 

  # Step 15: Add Elderly to multi-generational families (Household Excess)
  - name: "Add Elderly to multi-generational Families"
    type: "household_excess"
    description: "Add remaining old adults to existing multi generational family households"
    rule: "Multi-generational household"  # Enforce age constraints with existing adults

    target_patterns:
      - "1 >=0 >=0 >=0"
      - ">=2 >=0 >=0 >=0"

    add_category: "Old Adults"

    constraints:
      - category_sum: ["Old Adults"]
        max: 2

    add_distribution:
      type: "poisson"
      mean: 1
      min: 0
      max: 2

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: false 

  # Step 16: Add Eldelery to multi elderly households (Household Excess)
  - name: "Add Elderly to multi elderly households"
    type: "household_excess"
    description: "Add remaining old adults to existing multi elderly households"

    target_patterns:
      - "0 0 0 >=3"

    add_category: "Old Adults"

    constraints:
      - category_sum: ["Old Adults"]
        max: 8

    add_distribution:
      type: "poisson"
      mean: 6
      min: 0      
      max: 8  

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: false 
  # Step 17: Add Adults to multi-generational families (Household Excess)
  - name: "Add Adults to multi-generational Families"
    type: "household_excess"
    description: "Add remaining adults to existing multi generational family households"
    rule: "Multi-generational household"  # Enforce age constraints with existing household members

    target_patterns:
      - "1 >=0 >=0 >=0"
      - ">=2 >=0 >=0 >=0"

    add_category: "Adults"

    constraints:
      - category_sum: ["Adults"]
        max: 2

    add_distribution:
      type: "poisson"
      mean: 1
      min: 0
      max: 2

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: false 
  # Step 18: Flexible Households (Households)
  - name: "Flexible households"
    type: "household"
    description: "Allocate anything (but kids) to flexible households"

    patterns:
      - pattern: "0 >=0 >=0 >=0"

    max_households: null
    max_household_size: 10
    allocate_flexible: true  # Randomly allocate people to flexible (>=) categories
    refresh_pools: false
    enable_demotion: null

  - name: "Add Adults to flexible households"
    type: "household_excess"
    description: "Add Adults to flexible households"

    target_patterns:
      - "0 >=0 >=0 >=0"

    add_category: "Adults"

    constraints:
      - category_sum: ["Young Adults", "Adults", "Old Adults"]
        max: 10

    add_distribution: null

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: true 
  
  - name: "Add Old Adults to flexible households"
    type: "household_excess"
    description: "Add Old Adults to flexible households"

    target_patterns:
      - "0 >=0 >=0 >=0"

    add_category: "Old Adults"

    constraints:
      - category_sum: ["Young Adults", "Adults", "Old Adults"]
        max: 10

    add_distribution: null  

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: false 

  - name: "Add YA to flexible households"
    type: "household_excess"
    description: "Add YA to flexible households"

    target_patterns:
      - "0 >=0 >=0 >=0"

    add_category: "Young Adults"

    constraints:
      - category_sum: ["Young Adults", "Adults", "Old Adults"]
        max: 10

    add_distribution: null  

    max_per_household: null  # No hard limit (constraints handle max)
    refresh_pools: false 
  
  # Controlled promotion with specific rules
  - name: "Promote households for specific categories"
    type: "household_promotion"
    description: "Promote household patterns with controlled rules"

    promotion_rules:
      # Allow couples to accept young adults (roommates/adult children)
      - source_pattern: "0 0 2 0"
        target_pattern: ">=0 >=0 2 0"
        accept_categories: ["Kids", "Young Adults"]
        max_to_add: 3

      # Allow single adults to become multi-adult households
      - source_pattern: "0 0 1 0"
        target_pattern: ">=0 >=0 2 0"
        accept_categories: ["Kids", "Young Adults", "Adults"]
        max_to_add: 4

      # Allow elderly couples to accept more elderly
      - source_pattern: "0 0 0 1"
        target_pattern: "0 0 0 2"
        accept_categories: ["Old Adults"]
        max_to_add: 1

    refresh_pools: false

  # Final desperation round - allocate ALL remaining Young Adults
  - name: "Overflow remaining Young Adults"
    type: "household_overflow"
    description: "Distribute ALL remaining Young Adults balancedly across flexible households"

    target_patterns:
      - "0 >=0 >=0 >=0"   # Flexible households
      - "0 >=0 0 0"
      - "0 >=1 2 0"       # Some other pattern
      - "0 >=1 1 0"
      - ">=2 >=0 2 0"
      - ">=2 >=0 1 0"
      - "1 >=0 >=0 >=0"
      - ">=2 >=0 >=0 >=0"

    add_category: "Young Adults"

    pattern_bias:
      "0 >=0 >=0 >=0": 2.0
      "0 >=0 0 0": 5.0
      "0 >=1 2 0": 1.0  
      "0 >=1 1 0": 1.0
      "2 >=0 2 0": 1.0
      "2 >=0 1 0": 1.0
      "1 >=0 >=0 >=0": 1.0
      ">=2 >=0 >=0 >=0": 1.0

    refresh_pools: false

  # Final desperation round - allocate ALL remaining Young Adults
  - name: "Overflow remaining Adults"
    type: "household_overflow"
    description: "Distribute ALL remaining Adults balancedly across flexible households"

    target_patterns:
      - "0 >=0 >=0 >=0"   # Flexible households
      - "1 >=0 >=0 >=0"
      - ">=2 >=0 >=0 >=0"

    add_category: "Adults"

    pattern_bias:
      "0 >=0 >=0 >=0": 10.0
      "1 >=0 >=0 >=0": 1.0
      ">=2 >=0 >=0 >=0": 1.0

    refresh_pools: false

  # Final desperation round - allocate ALL remaining Young Adults
  - name: "Overflow remaining Old Adults"
    type: "household_overflow"
    description: "Distribute ALL remaining Old Adults balancedly across flexible households"

    target_patterns:
      - "0 >=0 >=0 >=0"   # Flexible households
      - "1 >=0 >=0 >=0"
      - ">=2 >=0 >=0 >=0"

    add_category: "Old Adults"

    pattern_bias:
      "0 >=0 >=0 >=0": 10.0
      "1 >=0 >=0 >=0": 1.0
      ">=2 >=0 >=0 >=0": 1.0

    refresh_pools: false
  # Final step: Promote households to accommodate ALL remaining people
  - name: "Promote and allocate all remaining"
    type: "household_promotion"
    description: "Promote household patterns and allocate ALL remaining people"

    target_categories:
      - "Kids"
      - "Young Adults"
      - "Adults"
      - "Old Adults"

    refresh_pools: false


# CONFIGURATION OPTIONS

# For household steps:
#   - patterns: List of household composition patterns, or null for "all"
#     Can be simple strings: "0 >=0 0 0"
#     Or dicts with assumptions: {pattern: "0 >=0 0 0", assumption: "0 2 0 0"}
#   - max_households: Limit number of households (null = no limit)
#   - refresh_pools: Rebuild person pools (true/false)
#   - enable_demotion: Override global demotion setting (null = use global)

# For venue steps:
#   - venue_type: Type of venue (must match venue data)
#   - capacity_property: Property name for capacity in venue data
#   - eligibility: List of criteria for who can be allocated
#     Each criterion specifies an attribute and constraints:
#       - {attribute: "age", min: 18, max: 65}  # Range check
#       - {attribute: "sex", value: "F"}        # Exact match
#     Empty list [] or {} means no filtering
#   - strategy: Allocation strategy ("random", "oldest_first", "youngest_first")

# For household_excess steps:
#   - target_patterns: List of original patterns to target for adding people
#   - add_category: Name of age category to add (e.g., "Young Adults", "Kids")
#   - constraints: List of constraint dicts (optional)
#     - category_sum: List of categories to sum together
#       max: Maximum allowed sum
#     - category: Single category name
#       max: Maximum allowed count
#     - household_size: true
#       max: Maximum household size
#   - add_distribution: Distribution for how many to add per household (optional)
#     Types:
#       - type: "weighted"
#         probabilities: {0: 0.4, 1: 0.35, 2: 0.20, 3: 0.05}
#       - type: "poisson"
#         mean: 3.5    # Lambda parameter (controls peak/mode)
#         min: 0       # Minimum value (default 0, set to 1 for zero-truncated)
#         max: 6       # Maximum value (cap, default 10)
#       - type: "normal"
#         mean: 1.5
#         std: 0.7
#   - max_per_household: Max people to add per household (null = no limit)
#   - refresh_pools: Rebuild person pools (true/false)

# TIPS

# When to use refresh_pools=true:
#   - After a venue allocation step
#   - Before final cleanup
#   - When you want to ensure pools only contain unallocated people

# Allocation order matters:
#   - Earlier steps have first pick of people
#   - Put high-priority allocations first
#   - Venue allocations "remove" people from household pool

# Example ordering strategies:
#   1. Priority-based: families → elderly → venues → adults → cleanup
#   2. Venue-first: venues → households with remaining
#   3. Interleaved: some households → venues → more households

